# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Python app to Azure Web App - bluegreenweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # BUILD JOB
  # =========================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Create virtual environment and install dependencies
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Upload application as artifact
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/


  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      # Download artifact
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78D67121C2EC400F907F13506EFAC2B6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4D30A09F2964E748388D66A6C7E1562 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E0E578ED1D094C898436169A723A0DEB }}

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bluegreenweb'
          slot-name: 'Production'
